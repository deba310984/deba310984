<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-labelledby="t d" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title id="t">DevOps Lifecycle</title>
  <desc id="d">A left-to-right delivery pipeline: Plan, Code (Git), Build (Maven), Test, Scan (Trivy / Checkov), Containerize (Docker), Deploy (Kubernetes / EKS), Observe (Prometheus / Grafana), Improve. GitHub Actions and Jenkins orchestrate the flow.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3C5068"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="998" height="248" rx="16" fill="#0B0F17" stroke="#223047" stroke-width="1.5"/>

  <text x="28" y="38" fill="#E6EDF3" font-size="18" font-weight="700">DevOps Lifecycle</text>
  <text x="28" y="58" fill="#64748B" font-size="12.5" font-family="ui-monospace, Menlo, monospace">plan → code → build → test → scan → ship → observe → improve</text>

  <!-- orchestrators band -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="11.5">
    <rect x="700" y="26" width="272" height="26" rx="13" fill="#0F1A28" stroke="#2A3B52"/>
    <circle cx="716" cy="39" r="3.5" fill="#A78BFA"/>
    <text x="726" y="43" fill="#9FB3C8">orchestrated by GitHub Actions · Jenkins</text>
  </g>

  <!-- track -->
  <line x1="60" y1="120" x2="940" y2="120" stroke="url(#line)" stroke-width="2.5"/>

  <!-- 9 stages -->
  <g font-size="12.5" text-anchor="middle">
    <!-- helper: node circle + label above + tool chip below -->
    <!-- positions evenly across 60..940 -->
    <!-- 1 PLAN -->
    <g>
      <circle cx="80" cy="120" r="9" fill="#101826" stroke="#38BDF8" stroke-width="2"/>
      <text x="80" y="100" fill="#D7E2EE" font-weight="600">PLAN</text>
    </g>
    <!-- 2 CODE -->
    <g>
      <circle cx="187" cy="120" r="9" fill="#101826" stroke="#38BDF8" stroke-width="2"/>
      <text x="187" y="100" fill="#D7E2EE" font-weight="600">CODE</text>
      <text x="187" y="150" fill="#6EE7FF" font-family="ui-monospace, Menlo, monospace" font-size="11">Git</text>
    </g>
    <!-- 3 BUILD -->
    <g>
      <circle cx="294" cy="120" r="9" fill="#101826" stroke="#38BDF8" stroke-width="2"/>
      <text x="294" y="100" fill="#D7E2EE" font-weight="600">BUILD</text>
      <text x="294" y="150" fill="#6EE7FF" font-family="ui-monospace, Menlo, monospace" font-size="11">Maven</text>
    </g>
    <!-- 4 TEST -->
    <g>
      <circle cx="401" cy="120" r="9" fill="#101826" stroke="#38BDF8" stroke-width="2"/>
      <text x="401" y="100" fill="#D7E2EE" font-weight="600">TEST</text>
      <text x="401" y="150" fill="#6EE7FF" font-family="ui-monospace, Menlo, monospace" font-size="11">unit · tf test</text>
    </g>
    <!-- 5 SCAN -->
    <g>
      <circle cx="508" cy="120" r="9" fill="#101826" stroke="#A78BFA" stroke-width="2"/>
      <text x="508" y="100" fill="#D7E2EE" font-weight="600">SCAN</text>
      <text x="508" y="150" fill="#C4B5FD" font-family="ui-monospace, Menlo, monospace" font-size="11">Trivy · Checkov</text>
    </g>
    <!-- 6 CONTAINERIZE -->
    <g>
      <circle cx="615" cy="120" r="9" fill="#101826" stroke="#38BDF8" stroke-width="2"/>
      <text x="615" y="100" fill="#D7E2EE" font-weight="600">PACKAGE</text>
      <text x="615" y="150" fill="#6EE7FF" font-family="ui-monospace, Menlo, monospace" font-size="11">Docker</text>
    </g>
    <!-- 7 DEPLOY -->
    <g>
      <circle cx="722" cy="120" r="9" fill="#101826" stroke="#38BDF8" stroke-width="2"/>
      <text x="722" y="100" fill="#D7E2EE" font-weight="600">DEPLOY</text>
      <text x="722" y="150" fill="#6EE7FF" font-family="ui-monospace, Menlo, monospace" font-size="11">K8s · EKS</text>
    </g>
    <!-- 8 OBSERVE -->
    <g>
      <circle cx="829" cy="120" r="9" fill="#101826" stroke="#A78BFA" stroke-width="2"/>
      <text x="829" y="100" fill="#D7E2EE" font-weight="600">OBSERVE</text>
      <text x="829" y="150" fill="#C4B5FD" font-family="ui-monospace, Menlo, monospace" font-size="11">Prometheus</text>
    </g>
    <!-- 9 IMPROVE -->
    <g>
      <circle cx="936" cy="120" r="9" fill="#101826" stroke="#38BDF8" stroke-width="2"/>
      <text x="936" y="100" fill="#D7E2EE" font-weight="600">IMPROVE</text>
    </g>
  </g>

  <!-- feedback loop -->
  <path d="M936,185 C936,220 80,220 80,145" fill="none" stroke="#2A3B52" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arr)"/>
  <text x="508" y="214" text-anchor="middle" fill="#5B6B7E" font-size="11" font-family="ui-monospace, Menlo, monospace">continuous feedback</text>
</svg>
