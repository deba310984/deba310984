<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="t d" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title id="t">Engineering Snapshot</title>
  <desc id="d">A control-panel grid of six domains: Cloud (AWS, Terraform), Platform (Docker, Kubernetes, EKS), Delivery (GitHub Actions, Jenkins, Git), Reliability (Prometheus, Grafana, CloudWatch), Security (Trivy, Checkov, IAM), Automation (Python, Bash, Ansible, Claude Code).</desc>
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="998" height="428" rx="16" fill="#0B0F17" stroke="#223047" stroke-width="1.5"/>

  <!-- title row -->
  <text x="28" y="40" fill="#E6EDF3" font-size="18" font-weight="700">Engineering Snapshot</text>
  <text x="28" y="60" fill="#64748B" font-size="12.5" font-family="ui-monospace, Menlo, monospace">control-panel &#8212; domains &amp; tooling</text>
  <rect x="820" y="30" width="152" height="22" rx="11" fill="#0F1A28" stroke="#2A3B52"/>
  <circle cx="836" cy="41" r="3.5" fill="#22D3EE"/>
  <text x="846" y="45" fill="#8B949E" font-size="11" font-family="ui-monospace, Menlo, monospace">6 domains</text>

  <!-- cards: 3 cols x 2 rows -->
  <!-- template dims: w=300 h=150 gap=22 ; start x=28 y=82 -->
  <g font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">
    <!-- row 1 -->
    <g transform="translate(28,82)">
      <rect width="300" height="150" rx="12" fill="#101826" stroke="#243040"/>
      <rect x="0" y="0" width="300" height="3" rx="1.5" fill="url(#hdr)"/>
      <text x="18" y="34" fill="#38BDF8" font-size="13" font-weight="700" letter-spacing="1.5" font-family="'Segoe UI', sans-serif">☁  CLOUD</text>
      <text x="18" y="66" fill="#D7E2EE" font-size="15">AWS</text>
      <text x="18" y="92" fill="#D7E2EE" font-size="15">Terraform</text>
      <text x="18" y="126" fill="#5B6B7E" font-size="11.5">provision · scale · codify</text>
    </g>
    <g transform="translate(350,82)">
      <rect width="300" height="150" rx="12" fill="#101826" stroke="#243040"/>
      <rect x="0" y="0" width="300" height="3" rx="1.5" fill="url(#hdr)"/>
      <text x="18" y="34" fill="#38BDF8" font-size="13" font-weight="700" letter-spacing="1.5" font-family="'Segoe UI', sans-serif">📦  PLATFORM</text>
      <text x="18" y="66" fill="#D7E2EE" font-size="15">Docker</text>
      <text x="18" y="92" fill="#D7E2EE" font-size="15">Kubernetes</text>
      <text x="18" y="118" fill="#D7E2EE" font-size="15">Amazon EKS</text>
    </g>
    <g transform="translate(672,82)">
      <rect width="300" height="150" rx="12" fill="#101826" stroke="#243040"/>
      <rect x="0" y="0" width="300" height="3" rx="1.5" fill="url(#hdr)"/>
      <text x="18" y="34" fill="#38BDF8" font-size="13" font-weight="700" letter-spacing="1.5" font-family="'Segoe UI', sans-serif">🔄  DELIVERY</text>
      <text x="18" y="66" fill="#D7E2EE" font-size="15">GitHub Actions</text>
      <text x="18" y="92" fill="#D7E2EE" font-size="15">Jenkins</text>
      <text x="18" y="118" fill="#D7E2EE" font-size="15">Git</text>
    </g>
    <!-- row 2 -->
    <g transform="translate(28,250)">
      <rect width="300" height="150" rx="12" fill="#101826" stroke="#243040"/>
      <rect x="0" y="0" width="300" height="3" rx="1.5" fill="url(#hdr)"/>
      <text x="18" y="34" fill="#A78BFA" font-size="13" font-weight="700" letter-spacing="1.5" font-family="'Segoe UI', sans-serif">📊  RELIABILITY</text>
      <text x="18" y="66" fill="#D7E2EE" font-size="15">Prometheus</text>
      <text x="18" y="92" fill="#D7E2EE" font-size="15">Grafana</text>
      <text x="18" y="118" fill="#D7E2EE" font-size="15">CloudWatch</text>
    </g>
    <g transform="translate(350,250)">
      <rect width="300" height="150" rx="12" fill="#101826" stroke="#243040"/>
      <rect x="0" y="0" width="300" height="3" rx="1.5" fill="url(#hdr)"/>
      <text x="18" y="34" fill="#A78BFA" font-size="13" font-weight="700" letter-spacing="1.5" font-family="'Segoe UI', sans-serif">🔐  SECURITY</text>
      <text x="18" y="66" fill="#D7E2EE" font-size="15">Trivy</text>
      <text x="18" y="92" fill="#D7E2EE" font-size="15">Checkov</text>
      <text x="18" y="118" fill="#D7E2EE" font-size="15">IAM · Secrets</text>
    </g>
    <g transform="translate(672,250)">
      <rect width="300" height="150" rx="12" fill="#101826" stroke="#243040"/>
      <rect x="0" y="0" width="300" height="3" rx="1.5" fill="url(#hdr)"/>
      <text x="18" y="34" fill="#A78BFA" font-size="13" font-weight="700" letter-spacing="1.5" font-family="'Segoe UI', sans-serif">💻  AUTOMATION</text>
      <text x="18" y="64" fill="#D7E2EE" font-size="15">Python · Bash</text>
      <text x="18" y="90" fill="#D7E2EE" font-size="15">Ansible</text>
      <text x="18" y="116" fill="#D7E2EE" font-size="15">Claude Code</text>
    </g>
  </g>
</svg>
