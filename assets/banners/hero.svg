<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-labelledby="t d" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title id="t">Debjit Sarkar — DevOps &amp; Cloud Engineer</title>
  <desc id="d">Hero banner: Debjit Sarkar, DevOps and Cloud Engineer. Focus on infrastructure automation, Kubernetes, AWS and reliability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F17"/>
      <stop offset="0.6" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="248" rx="16" fill="url(#bg)" stroke="#223047" stroke-width="1.5"/>
  <!-- faint grid -->
  <g stroke="#17202E" stroke-width="1">
    <line x1="0" y1="62" x2="1000" y2="62"/><line x1="0" y1="124" x2="1000" y2="124"/><line x1="0" y1="186" x2="1000" y2="186"/>
    <line x1="250" y1="0" x2="250" y2="250"/><line x1="500" y1="0" x2="500" y2="250"/><line x1="750" y1="0" x2="750" y2="250"/>
  </g>
  <rect x="1" y="1" width="998" height="248" rx="16" fill="none" stroke="#223047" stroke-width="1.5"/>

  <!-- accent bar -->
  <rect x="40" y="52" width="5" height="120" rx="2.5" fill="url(#accent)"/>

  <!-- status chip -->
