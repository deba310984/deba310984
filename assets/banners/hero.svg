    <circle cx="6" cy="0" r="4" fill="#22D3EE"/>
    <text x="18" y="4" fill="#8B949E" font-size="12" letter-spacing="2" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">SYSTEM&#160;ONLINE&#160;·&#160;DEVOPS&#160;/&#160;CLOUD&#160;/&#160;SRE</text>
  </g>

  <text x="62" y="96" fill="#E6EDF3" font-size="40" font-weight="700">Hi, I'm Debjit Sarkar</text>
  <text x="63" y="134" fill="#38BDF8" font-size="23" font-weight="600">DevOps &amp; Cloud Engineer</text>
  <text x="63" y="164" fill="#9FB3C8" font-size="15.5">Infrastructure Automation · Kubernetes · AWS · Reliability Engineering</text>

  <!-- tech chips -->
