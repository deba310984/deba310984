      <rect x="74" y="0" width="104" height="30" rx="7" fill="#101A28" stroke="#2A3B52"/><text x="126" y="20" text-anchor="middle">Terraform</text>
      <rect x="188" y="0" width="84" height="30" rx="7" fill="#101A28" stroke="#2A3B52"/><text x="230" y="20" text-anchor="middle">Docker</text>
      <rect x="282" y="0" width="114" height="30" rx="7" fill="#101A28" stroke="#2A3B52"/><text x="339" y="20" text-anchor="middle">Kubernetes</text>
      <rect x="406" y="0" width="150" height="30" rx="7" fill="#101A28" stroke="#2A3B52"/><text x="481" y="20" text-anchor="middle">GitHub Actions</text>
    </g>
