<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="t d" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title id="t">Reusable Terraform Module Composition</title>
  <desc id="d">One module library with reusable VPC and Security Group modules composes two environments: dev with two Availability Zones and a single NAT Gateway, and prod with three Availability Zones and per-AZ NAT Gateways. GitHub Actions validates every change.</desc>
  <defs>
    <marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#38BDF8"/></marker>
  </defs>
  <rect x="1" y="1" width="998" height="338" rx="16" fill="#0B0F17" stroke="#223047" stroke-width="1.5"/>
  <text x="28" y="38" fill="#E6EDF3" font-size="18" font-weight="700">Reusable Module Composition</text>
  <text x="28" y="58" fill="#64748B" font-size="12.5" font-family="ui-monospace, Menlo, monospace">one codebase → many environments · no copy-paste</text>

  <!-- module library -->
  <rect x="40" y="100" width="230" height="190" rx="12" fill="#101826" stroke="#243040"/>
  <rect x="40" y="100" width="230" height="3" rx="1.5" fill="#38BDF8"/>
  <text x="60" y="130" fill="#38BDF8" font-size="13" font-weight="700" letter-spacing="1" font-family="ui-monospace, Menlo, monospace">modules/</text>
  <rect x="60" y="146" width="190" height="42" rx="8" fill="#13233A" stroke="#38BDF8"/>
  <text x="155" y="172" text-anchor="middle" fill="#CDE8FF" font-size="13" font-family="ui-monospace, Menlo, monospace">vpc</text>
  <rect x="60" y="200" width="190" height="42" rx="8" fill="#13233A" stroke="#38BDF8"/>
  <text x="155" y="226" text-anchor="middle" fill="#CDE8FF" font-size="13" font-family="ui-monospace, Menlo, monospace">security-group</text>
  <text x="60" y="270" fill="#5B6B7E" font-size="11" font-family="ui-monospace, Menlo, monospace">rule-driven · composable</text>

  <!-- arrows to envs -->
  <line x1="270" y1="160" x2="430" y2="150" stroke="#38BDF8" stroke-width="1.8" marker-end="url(#m)"/>
  <line x1="270" y1="230" x2="430" y2="250" stroke="#38BDF8" stroke-width="1.8" marker-end="url(#m)"/>

  <!-- dev env -->
  <rect x="440" y="108" width="520" height="86" rx="12" fill="#0A1119" stroke="#1E2A3A"/>
  <text x="462" y="134" fill="#7DD3FC" font-size="13" font-weight="700" font-family="ui-monospace, Menlo, monospace">environments/dev</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#9FB3C8">
    <rect x="462" y="146" width="150" height="30" rx="7" fill="#101A28" stroke="#2A3B52"/><text x="537" y="166" text-anchor="middle">2 Availability Zones</text>
    <rect x="624" y="146" width="150" height="30" rx="7" fill="#101A28" stroke="#2A3B52"/><text x="699" y="166" text-anchor="middle">single NAT (cost-lean)</text>
  </g>

  <!-- prod env -->
  <rect x="440" y="206" width="520" height="86" rx="12" fill="#0A1119" stroke="#1E2A3A"/>
  <text x="462" y="232" fill="#C4B5FD" font-size="13" font-weight="700" font-family="ui-monospace, Menlo, monospace">environments/prod</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#9FB3C8">
    <rect x="462" y="244" width="150" height="30" rx="7" fill="#101A28" stroke="#2A3B52"/><text x="537" y="264" text-anchor="middle">3 Availability Zones</text>
    <rect x="624" y="244" width="170" height="30" rx="7" fill="#101A28" stroke="#2A3B52"/><text x="709" y="264" text-anchor="middle">per-AZ NAT (resilient)</text>
  </g>

  <!-- CI badge -->
  <rect x="806" y="244" width="134" height="30" rx="7" fill="#0F1A28" stroke="#A78BFA"/>
  <text x="873" y="264" text-anchor="middle" fill="#C4B5FD" font-size="11" font-family="ui-monospace, Menlo, monospace">CI validated</text>
  <rect x="806" y="146" width="134" height="30" rx="7" fill="#0F1A28" stroke="#A78BFA"/>
  <text x="873" y="166" text-anchor="middle" fill="#C4B5FD" font-size="11" font-family="ui-monospace, Menlo, monospace">CI validated</text>
</svg>
